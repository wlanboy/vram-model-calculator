[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vram-model-calculator"
version = "0.1.0"
description = "GGUF model scanner and VRAM calculator for local LLMs"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "gguf>=0.19.0",
    "tqdm>=4.70.1",
]

[project.scripts]
vram-model-calculator = "vram_model_calculator.cli:main"
gguf-scanner = "vram_model_calculator.cli:scan"
gguf-checker = "vram_model_calculator.cli:check"
vram-calculator = "vram_model_calculator.cli:calculate"
hf-copy = "vram_model_calculator.cli:hf_copy"

[tool.hatch.build.targets.wheel]
packages = ["vram_model_calculator"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
