[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vram-model-calculator"
version = "0.1.0"
description = "GGUF model scanner and VRAM calculator for local LLMs"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "gguf>=0.18.0",
    "tqdm>=4.67.3",
]

[project.scripts]
gguf-scanner = "vram_model_calculator.gguf_scanner:main"
gguf-checker = "vram_model_calculator.gguf_checker:main"
vram-calculator = "vram_model_calculator.vram_calculator:main"

[tool.hatch.build.targets.wheel]
packages = ["vram_model_calculator"]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "ruff>=0.15.12",
]
