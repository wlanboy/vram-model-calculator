<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="4" fill="#0d1117"/>

  <!-- Chip body -->
  <rect x="8" y="8" width="16" height="16" rx="2" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>

  <!-- Inner chip pattern (rows of memory cells) -->
  <rect x="10" y="10" width="5" height="2" rx="0.5" fill="#58a6ff" opacity="0.9"/>
  <rect x="17" y="10" width="5" height="2" rx="0.5" fill="#58a6ff" opacity="0.9"/>
  <rect x="10" y="13" width="5" height="2" rx="0.5" fill="#3fb950" opacity="0.9"/>
  <rect x="17" y="13" width="5" height="2" rx="0.5" fill="#3fb950" opacity="0.9"/>
  <rect x="10" y="16" width="5" height="2" rx="0.5" fill="#58a6ff" opacity="0.7"/>
  <rect x="17" y="16" width="5" height="2" rx="0.5" fill="#58a6ff" opacity="0.7"/>
  <rect x="10" y="19" width="5" height="2" rx="0.5" fill="#3fb950" opacity="0.7"/>
  <rect x="17" y="19" width="5" height="2" rx="0.5" fill="#3fb950" opacity="0.7"/>

  <!-- Pins top -->
  <rect x="11" y="5" width="1.5" height="3" rx="0.5" fill="#58a6ff"/>
  <rect x="14.5" y="5" width="1.5" height="3" rx="0.5" fill="#58a6ff"/>
  <rect x="18" y="5" width="1.5" height="3" rx="0.5" fill="#58a6ff"/>

  <!-- Pins bottom -->
  <rect x="11" y="24" width="1.5" height="3" rx="0.5" fill="#58a6ff"/>
  <rect x="14.5" y="24" width="1.5" height="3" rx="0.5" fill="#58a6ff"/>
  <rect x="18" y="24" width="1.5" height="3" rx="0.5" fill="#58a6ff"/>

  <!-- Pins left -->
  <rect x="5" y="11" width="3" height="1.5" rx="0.5" fill="#58a6ff"/>
  <rect x="5" y="14.5" width="3" height="1.5" rx="0.5" fill="#58a6ff"/>
  <rect x="5" y="18" width="3" height="1.5" rx="0.5" fill="#58a6ff"/>

  <!-- Pins right -->
  <rect x="24" y="11" width="3" height="1.5" rx="0.5" fill="#58a6ff"/>
  <rect x="24" y="14.5" width="3" height="1.5" rx="0.5" fill="#58a6ff"/>
  <rect x="24" y="18" width="3" height="1.5" rx="0.5" fill="#58a6ff"/>
</svg>
